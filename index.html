  <p>이 앱은 중학생의 고등학교 선택을 돕는 참고 자료입니다. 전형 방법, 일정, 학교 지정·운영 현황은 해마다 바뀌고 정책에 따라 달라질 수 있어요. 최종 내용은 반드시 학교 홈페이지와 시도교육청 모집요강에서 확인하세요. 직업계고 학과 정보는 HIFIVE 학교별 학과정보 자료를 바탕으로 학과 이름을 분야별로 묶은 것이에요. 대학 학과·취업률 정보는 커리어넷 학과정보와 대학 졸업자 취업통계(2024~2025년) 자료를 바탕으로 했어요. (2026년 11월 기준으로 정리)</p>

/* ---------- 계산 ---------- */
function pcts(){const s={R:0,I:0,A:0,S:0,E:0,C:0};Q.forEach((q,i)=>{s[q[0]]+=S.ans[i]||1});const o={};for(const k in s)o[k]=Math.round((s[k]-3)/9*100);return o}
function rank(){
 const p=pcts(),c=S.chips,out=[];
 const fchips=c.filter(x=>FI[x]);
 for(const id of TORDER){
  const w=TYPES[id].w;let num=0,den=0;for(const k in w){num+=w[k]*p[k];den+=w[k]}
  let sc=num/den;const pos=[],neg=[],a=ADJ[id]||{};
  for(const k in a){const v=S.pref[k];if(v&&a[k][v]!==undefined){const d=a[k][v];sc+=d;const lab=PQ.find(x=>x.k===k).o.find(o=>o[0]===v)[1];if(d>=8)pos.push('“'+lab+'” 응답과 잘 맞아요');else if(d<=-10)neg.push('“'+lab+'” 응답과는 거리가 있어요')}}
  let bonus=0;
  if(id==='science'&&c.includes('sci'))bonus+=8;
  if(id==='private'&&c.includes('sci'))bonus+=2;
  if(id==='foreign'&&c.includes('lang'))bonus+=10;
  if(id==='arts'&&c.includes('art'))bonus+=12;
  if(id==='vocational')bonus+=Math.min(8,fchips.length*4);
  if(id==='meister')fchips.forEach(x=>bonus+=FI[x].meister?4:1);
  sc+=bonus;
  const tr=Object.keys(w).filter(k=>w[k]>=2&&p[k]>=60).sort((x,y)=>p[y]-p[x]).slice(0,2).map(k=>RI[k].n+' 성향이 높아요');
  if(bonus>0)tr.push('관심 분야로 고른 항목과 연결돼요');
  out.push({id,sc:Math.max(5,Math.min(98,Math.round(sc))),why:tr.concat(pos).slice(0,4),warn:neg.slice(0,2)});
 }
 return out.sort((x,y)=>y.sc-x.sc);
}
function fieldRank(only){
 const p=pcts();
 return FIELDS.filter(f=>!only||f.meister).map(f=>{let n=0,d=0;for(const k in f.tr){n+=f.tr[k]*p[k];d+=f.tr[k]}let sc=n/d+(S.chips.includes(f.id)?25:0);return{f,sc:Math.max(5,Math.min(98,Math.round(sc)))}}).sort((a,b)=>b.sc-a.sc);
}
const curType=()=>S.type||(S.done?rank()[0].id:'general');
function topTraits(){const p=pcts();return Object.keys(p).sort((a,b)=>p[b]-p[a])}

  <div class="field"><label>지금 학년은?</label><div class="tabs" role="group" aria-label="학년">${[1,2,3].map(g=>`<button data-a="grade" data-v="${g}" aria-pressed="${S.grade===g}">중${g}</button>`).join('')}</div></div>`;

}

const P=o=>Object.assign({ff:S.ff,fs:S.fs,fr:S.fr,q:S.fq.trim()},o);
function match(s,p){
 if(S.fk!=='all'&&s.k!==S.fk)return null;
 if(S.fe!=='all'&&s.e!==S.fe)return null;
 if(S.fx!=='all'&&s.x!==S.fx)return null;
 if(p.fr&&p.fr!=='all'&&s.r!==p.fr)return null;
 let ds=s.d;
 if(p.ff!=='all'){ds=ds.filter(d=>d.f===p.ff);if(p.fs!=='all')ds=ds.filter(d=>d.s===+p.fs)}
 if(p.q&&!(s.n.includes(p.q)||s.m.includes(p.q)))ds=ds.filter(d=>d.n.includes(p.q));
 return ds.length?ds:null;
}
const kShort=k=>k==='일반고(종합고)'?'종합고':k;
function sCard(s,ds){

 <span class="dps">${ds.slice(0,5).map(d=>`<span class="dp">${esc(d.n)}</span>`).join('')}${ds.length>5?`<span class="dp more">외 ${ds.length-5}개</span>`:''}</span>

}
function findResults(){

 // 지역 × 분야 표

 const mtx=`<div class="tablewrap"><table class="mtx"><thead><tr><th>지역</th>${VF.map(f=>`<th>${AB[f]}</th>`).join('')}</tr></thead><tbody>${RK.map(r=>`<tr><th>${r}</th>${VF.map(f=>{const n=cnt[r][f]||0;if(!n)return '<td><span class="z">·</span></td>';const a=Math.round(n/cm*80);return `<td><button class="cell ${S.fr===r&&S.ff===f?'on':''}" data-a="cell" data-r="${r}" data-f="${f}" style="background:color-mix(in srgb,var(--brand) ${a}%,var(--sf));color:${a>45?'var(--onbrand)':'var(--ink)'}" aria-label="${r} ${AB[f]} ${n}개교">${n}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
 // 지역별 목록

}

function agg(keyFn){const m={};URW.forEach(r=>{const k=keyFn(r);[['a',r.a],['b',r.b]].forEach(([yy,y])=>{if(!y||y[0]<=0)return;const o=m[k]=m[k]||{a:[0,0],b:[0,0],n:0};o[yy][0]+=y[0];o[yy][1]+=y[2]*y[0]});});URW.forEach(r=>{const k=keyFn(r);m[k]&&(m[k].n++)});
 for(const k in m){const o=m[k];o.r24=o.a[0]?Math.round(o.a[1]/o.a[0]*10)/10:null;o.r25=o.b[0]?Math.round(o.b[1]/o.b[0]*10)/10:null;o.g=o.a[0]+o.b[0];o.avg=o.g?Math.round((o.a[1]+o.b[1])/o.g*10)/10:null}return m}
const AGF=agg(r=>r.f),AG7=agg(r=>UD.g7[r.g7]);
function uniRateTxt(fid){const ids=(LINK[fid]||[]).slice(0,2);const a=ids.map(i=>AGF[i]&&AGF[i].avg!=null?UNAME(i)+' '+AGF[i].avg+'%':'').filter(Boolean);return a.length?a.join(' · '):'자료 없음'}
function cnAvg(fid){const l=UCN.filter(c=>c.f===fid&&c.k===1&&c.w!=null);return l.length?Math.round(l.reduce((a,c)=>a+c.w,0)/l.length*10)/10:null}

const uP=()=>({f:S.uf,g:S.ug,r:S.ur,min:+S.umin||0,q:S.uq.trim()});
function uMatch(r,p){
 if(p.f!=='all'&&r.f!==p.f)return false;
 if(p.g!=='all'&&UD.g7[r.g7]!==p.g)return false;
 if(r.G<p.min)return false;
 const s=USC[r.s];
 if(p.r!=='all'&&!s.sido.includes(p.r))return false;
 if(p.q&&!(s.n.includes(p.q)||r.n.includes(p.q)))return false;
 return true;
}
const bar=(v,mx,cls)=>`<div class="tr" role="img" aria-label="${v==null?'자료 없음':v+'%'}"><i style="width:${v==null?0:Math.max(2,v/(mx||100)*100)}%"></i></div>`;
function rateBar(label,r24,r25,g,onclick){
 const b=(v,t)=>`<div class="rb"><span class="mut">${t}</span>${bar(v,100)}<em>${v==null?'-':v+'%'}</em></div>`;
 return `<${onclick?'button':'div'} class="rrow" ${onclick||''}><span class="rl"><b>${esc(label)}</b><span class="mut">졸업자 ${g==null?'-':g.toLocaleString()}명</span></span><span class="rbs">${b(r24,'2024')}${b(r25,'2025')}</span></${onclick?'button':'div'}>`;
}
function uBridge(){
 const f=S.ufrom&&FI[S.ufrom];if(!f)return '';
 const ids=LINK[f.id]||[];
 return `<div class="callout acc"><b>고교 분야 “${f.n}”</b>와 이어지는 대학 분야예요. 눌러서 바로 살펴보세요.<div class="row" style="margin-top:8px">${ids.map(i=>`<button class="chip" data-a="ufield" data-v="${i}" aria-pressed="${S.uf===i}">${UNAME(i)}${AGF[i]&&AGF[i].avg!=null?` <small>취업률 ${AGF[i].avg}%</small>`:''}</button>`).join('')}</div></div>`;
}
function uFieldChips(){
 const hsIds=new Set(VF);const rec=S.done?fieldRank(false).slice(0,3).map(x=>x.f.id):[];
 const recU=new Set(rec.flatMap(x=>LINK[x]||[]));
 return `<div class="row"><button class="chip" data-a="ufield" data-v="all" aria-pressed="${S.uf==='all'}">전체</button>${UDF.filter(d=>d[0]!=='etc').map(d=>{const a=AGF[d[0]];const n=a?a.n:0;return `<button class="chip" data-a="ufield" data-v="${d[0]}" aria-pressed="${S.uf===d[0]}">${d[1]} <small>${n}</small>${recU.has(d[0])?' <span class="tag amb">추천</span>':''}</button>`}).join('')}</div>`;
}
/* 대학별 목록 */
function uResults(){
 const p=uP();
 const by={};URW.forEach(r=>{if(uMatch(r,p))(by[r.s]=by[r.s]||[]).push(r)});
 let list=Object.keys(by).map(k=>{const L=by[k],s=USC[k];let w=0,sm=0,G=0;L.forEach(r=>{G+=r.G;if(r.R!=null){w+=r.G;sm+=r.R*r.G}});return{s,L,G,R:w?Math.round(sm/w*10)/10:null}});
 // 지역 막대는 지역 필터를 빼고 센다
 const p2=Object.assign({},p,{r:'all'}),cnt={};const seen={};
 URW.forEach(r=>{if(uMatch(r,p2)){const s=USC[r.s];s.sido.forEach(g=>{const key=g+'|'+s.i;if(!seen[key]){seen[key]=1;cnt[g]=(cnt[g]||0)+1}})}});
 const mx=Math.max(1,...RK.map(r=>cnt[r]||0));
 const strip=`<div class="rstrip">${RK.map(r=>`<button class="rc ${S.ur===r?'on':''}" data-a="ureg" data-v="${r}" ${cnt[r]?'':'disabled'} style="--p:${Math.round((cnt[r]||0)/mx*100)}%"><span>${r}</span><b>${cnt[r]||0}</b></button>`).join('')}</div>`;
 const so=S.us;
 list.sort((a,b)=>so==='g'?b.G-a.G:so==='name'?a.s.n.localeCompare(b.s.n):(b.R==null)-(a.R==null)||(b.R||0)-(a.R||0));
 const card=o=>{const top=o.L.slice().sort((a,b)=>(b.R||0)-(a.R||0)).slice(0,4);
  return `<button class="sch2" data-a="uschool" data-v="${o.s.i}"><span class="row" style="gap:6px;justify-content:space-between"><b>${esc(o.s.n)}</b>${o.R!=null?`<span class="tag ${o.R>=65?'acc':''}">취업률 ${o.R}%</span>`:''}</span>
  <span class="row" style="gap:6px"><span class="tag">${esc(o.s.reg)}</span><span class="tag">해당 학과 ${o.L.length}개</span><span class="tag">졸업자 ${o.G.toLocaleString()}명</span></span>
  <span class="dps">${top.map(r=>`<span class="dp">${esc(r.n)}${r.R!=null?' '+r.R+'%':''}</span>`).join('')}${o.L.length>4?`<span class="dp more">외 ${o.L.length-4}개</span>`:''}</span></button>`};
 const ttl=S.uf==='all'?'전체 분야':UNAME(S.uf);
 return `<div class="panel"><div class="row" style="justify-content:space-between"><h2>${esc(ttl)} · 대학 목록</h2><span class="tag acc">${list.length}개 대학</span></div>
 <p class="lead" style="font-size:14px">지역을 누르면 그 지역 대학만 보여요. 대학을 누르면 학과별 졸업자 수와 취업률이 나와요. 취업률은 해당 학과의 2024·2025년 졸업자를 합쳐 졸업자 수로 가중 평균한 값이에요.</p>${strip}
 <div class="grid">${list.map(card).join('')||'<div class="callout">조건에 맞는 대학이 없어요. 필터를 줄여 보세요.</div>'}</div></div>`;
}
/* 계열·분야별 취업률 */
function uRates(){
 const rows7=UD.g7.map(g=>[g,AG7[g]]).filter(x=>x[1]).sort((a,b)=>(b[1].avg||0)-(a[1].avg||0));
 const rowsF=UDF.filter(d=>d[0]!=='etc'&&AGF[d[0]]).map(d=>[d,AGF[d[0]]]).sort((a,b)=>(b[1].avg||0)-(a[1].avg||0));
 return `<div class="panel"><h2>대학 계열별 취업률</h2>
 <p class="lead">대학 졸업자 취업통계(2024·2025년 졸업자)를 계열별로 묶은 값이에요. 졸업자 수로 가중 평균했어요. 취업률은 졸업자 중 진학·입대 등을 뺀 사람 가운데 취업한 비율이에요.</p>
 ${rows7.map(x=>rateBar(x[0],x[1].r24,x[1].r25,x[1].g)).join('')}</div>
 <div class="panel"><h2>분야별 취업률</h2><p class="lead">분야를 누르면 그 분야의 대학과 학과를 볼 수 있어요. 졸업자가 적은 분야는 해마다 값이 많이 달라질 수 있어요.</p>
 ${rowsF.map(x=>rateBar(x[0][1],x[1].r24,x[1].r25,x[1].g,`data-a="ufield" data-v="${x[0][0]}" data-t="univ"`)).join('')}</div>
 <div class="callout">취업률이 높다고 꼭 좋은 학과는 아니에요. 졸업 후 진학(대학원 등)을 많이 하는 학과는 취업률 계산에서 진학자가 빠져요. 내가 좋아하고 잘하는 분야인지가 먼저예요.</div>`;
}
/* 커리어넷 학과 사전 */
function uDict(){
 const schoolsOf={};URW.forEach(r=>{if(r.cn>=0)(schoolsOf[r.cn]=schoolsOf[r.cn]||new Set()).add(r.s)});
 let L=UCN.filter(c=>(S.uf==='all'||c.f===S.uf)&&(S.ug==='all'||UD.g7[c.g]===S.ug)&&(S.uk==='all'||c.k===+S.uk)&&(!S.uq.trim()||c.n.includes(S.uq.trim())));
 L.sort((a,b)=>(b.w||0)-(a.w||0));
 const kn=k=>k===1?'대학교':'전문대학';
 return `<div class="panel"><div class="row" style="justify-content:space-between"><h2>커리어넷 학과 사전</h2><span class="tag acc">${L.length}개 학과</span></div>
 <p class="lead" style="font-size:14px">커리어넷이 소개하는 학과예요. 학과를 누르면 커리어넷에서 설명과 관련 직업을 볼 수 있어요. “엑셀 대학”은 취업통계 자료에 이 학과가 있는 대학 수예요.</p>
 <div class="grid">${L.slice(0,120).map(c=>{const n=schoolsOf[c.i]?schoolsOf[c.i].size:0;return `<div class="sch"><div class="row" style="justify-content:space-between"><h3>${esc(c.n)}</h3><span class="tag ${c.k===1?'acc':'amb'}">${kn(c.k)}</span></div>
  <div class="row"><span class="tag">${UD.g7[c.g]}</span><span class="tag">${esc(UNAME(c.f))}</span></div>
  <div class="rb"><span class="mut">취업률</span>${bar(c.w,100)}<em>${c.w==null?'-':c.w+'%'}</em></div><div class="rb"><span class="mut">진학률</span>${bar(c.e,100)}<em>${c.e==null?'-':c.e+'%'}</em></div>
  <div class="row">${ext(cnUrl(c.q),'커리어넷에서 보기','ghost')}${n?`<button class="btn sm" data-a="udept" data-v="${esc(normQ(c.n))}">대학 ${n}곳 보기</button>`:''}</div></div>`}).join('')}</div>${L.length>120?`<p class="mut">취업률 높은 순으로 120개까지 보여요. 분야나 계열을 고르면 더 좁혀져요.</p>`:''}</div>`;
}
function vUniv(){
 const sel=(id,key,opts,lab)=>`<div class="field"><label for="${id}">${lab}</label><select class="sel" id="${id}" data-a="${key}">${opts.map(o=>`<option value="${o[0]}" ${String(S[key])===String(o[0])?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
 const tabs=`<div class="tabs" role="group" aria-label="보기 방식"><button data-a="utab" data-v="univ" aria-pressed="${S.ut==='univ'}">대학 찾기</button><button data-a="utab" data-v="rate" aria-pressed="${S.ut==='rate'}">계열별 취업률</button><button data-a="utab" data-v="dict" aria-pressed="${S.ut==='dict'}">학과 사전</button></div>`;
 const totalDept=URW.length;
 const filt=S.ut==='rate'?'':`<h3>② 조건을 좁혀 보세요 <span class="tag">선택 사항</span></h3>
 <div class="grid">${S.ut==='univ'?sel('uf-r','ur',[['all','전국 전체']].concat(RK.map(r=>[r,r])),'지역'):''}${sel('uf-g','ug',[['all','전체']].concat(UD.g7.map(g=>[g,g])),'계열')}
 ${S.ut==='univ'?sel('uf-min','umin',[['0','모두'],['10','졸업자 10명 이상'],['20','졸업자 20명 이상'],['50','졸업자 50명 이상']],'졸업자 수(2년 합계)')+sel('uf-s','us',[['rate','취업률 높은 순'],['g','졸업자 많은 순'],['name','이름 순']],'정렬'):sel('uf-k','uk',[['all','대학교+전문대학'],['1','대학교'],['2','전문대학']],'종류')}
 <div class="field"><label for="uq">${S.ut==='univ'?'대학·학과 이름':'학과 이름'}으로 찾기</label><input class="sel" id="uq" type="search" placeholder="예: 컴퓨터, 간호, 서울대" value="${esc(S.uq)}"></div></div>
 <div><button class="btn ghost sm" data-a="uclear">필터 모두 지우기</button></div>`;
 return `${NOTICE}<section class="panel"><h2>대학·학과 찾기</h2>
 <p class="lead">고등학교에서 고른 분야가 대학에서는 어떤 학과로 이어지는지 알아보고, 그 학과가 있는 대학과 졸업 후 취업률을 살펴봐요. 대학 자료는 2024·2025년 졸업자 취업통계(${USC.length}개 대학, 학과 ${totalDept.toLocaleString()}건)와 커리어넷 학과정보(${UCN.length}개 학과)예요.</p>${tabs}
 ${uBridge()}
 <h3>① 관심 분야를 고르세요</h3>${uFieldChips()}
 ${S.uf!=='all'&&AGF[S.uf]?`<div class="callout acc"><b>${esc(UNAME(S.uf))}</b> · 대학 졸업자 취업률 2024년 ${AGF[S.uf].r24==null?'-':AGF[S.uf].r24+'%'}, 2025년 ${AGF[S.uf].r25==null?'-':AGF[S.uf].r25+'%'} · 학과 ${AGF[S.uf].n}건${cnAvg(S.uf)!=null?` · 커리어넷 학과 평균 취업률 ${cnAvg(S.uf)}%`:''}</div>`:''}
 ${filt}</section>
 <div id="ures" style="display:flex;flex-direction:column;gap:18px">${S.ut==='univ'?uResults():S.ut==='rate'?uRates():uDict()}</div>
 <div class="callout">학교 정보는 참고용이에요. 대학별 모집 학과, 전형은 해마다 달라지므로 <a href="https://www.adiga.kr" target="_blank" rel="noopener">어디가</a>와 대학 입학처의 모집요강을 꼭 확인하세요. 학과 소개와 관련 직업은 <a href="https://www.career.go.kr/cloud/w/major/uList" target="_blank" rel="noopener">커리어넷 학과정보</a>에서 볼 수 있어요.</div>`;
}
function uModal(i){
 const s=USC[i],p=uP();S.last=s.n;save();
 const all=URW.filter(r=>r.s===i),L=all.filter(r=>uMatch(r,Object.assign({},p,{r:'all',q:'',min:0}))&&(S.uf==='all'||r.f===S.uf)),show=(S.uf==='all'?all:L);

 modal(`<h2>${esc(s.n)}</h2><div class="row"><span class="tag">${esc(s.reg)}</span><span class="tag acc">대학 전체 취업률 2024 ${y(s.y24)} · 2025 ${y(s.y25)}</span></div>
 <h4>${S.uf==='all'?'수록된 모든 학과':esc(UNAME(S.uf))+' 관련 학과'} (${sorted.length}개)</h4>
 <div class="tablewrap"><table><thead><tr><th>학과</th><th>분야</th><th>졸업자 24/25</th><th>취업률 2024</th><th>취업률 2025</th></tr></thead><tbody>${rows}</tbody></table></div>
 ${sorted.length>80?`<p class="mut">졸업자가 많은 순으로 80개까지 보여요.</p>`:''}
 <p class="lead" style="font-size:12px">졸업자가 ${SMALL}명보다 적은 학과는 취업률이 크게 흔들릴 수 있어서 “표본 적음”으로 표시했어요. ↗를 누르면 커리어넷의 학과 설명으로 이동해요.</p>
 <h4>입학정보 확인하기</h4>

const normD2=n=>n.replace(/\(.*?\)/g,'').replace(/\s/g,'').replace(/(학과|학부|전공|과|부)$/,'');
const URN={};URW.forEach(r=>{const k=normD2(r.n);(URN[k]=URN[k]||[]).push(r)});
const DER={};
DP.deps.forEach(d=>{const c=new Set();d.n.split(',').forEach(x=>{x=x.trim();c.add(normD2(x));const m=x.match(/\((.*?)\)/);if(m)c.add(normD2(m[1]))});
 let G=0,sm=0;const sch=new Set();c.forEach(k=>(URN[k]||[]).forEach(r=>{[r.a,r.b].forEach(y=>{if(y&&y[0]>0){G+=y[0];sm+=y[2]*y[0]}});sch.add(r.s)}));
 if(G)DER[d.id]={R:Math.round(sm/G*10)/10,G,n:sch.size,q:[...c][0]}});

 else if(a==='pickf'){const f=FI[v];S.field=v;S.type=f.meister&&rank().find(x=>x.id==='meister').sc>=rank().find(x=>x.id==='vocational').sc?'meister':'vocational';save();go('detail');return}
 else if(a==='type'||a==='rtype'){S.type=v;if(a==='type')qi=0}
 else if(a==='field')S.field=S.field===v?null:v;
 else if(a==='mq')S.mq[+el.dataset.i]=v;
 else if(a==='findf'){S.ff=v;S.fs='all';S.fm='vo';S.fr='all';save();go('schools');return}
 else if(a==='findt'){if(v==='meister'||v==='vocational'){S.fm='vo';S.fk=v==='meister'?'마이스터고':'특성화고'}else{S.fm='sp';S.sp=v}save();go('schools');return}
 else if(a==='fmode')S.fm=v;
 else if(a==='ffield'){S.ff=S.ff===v?'all':v;S.fs='all'}
 else if(a==='fsub')S.fs=S.fs===v?'all':v;
 else if(a==='fr')S.fr=S.fr===v?'all':v;
 else if(a==='cell'){S.ff=el.dataset.f;S.fs='all';S.fr=el.dataset.r}
 else if(a==='fclear'){S.ff='all';S.fs='all';S.fr='all';S.fk='all';S.fe='all';S.fx='all';S.fq=''}
 else if(a==='sptype')S.sp=v;
 else if(a==='vschool'){vModal(+v);return}
 else if(a==='froad'){const f=FI[v];if(f){S.field=v;S.type=f.meister?'meister':'vocational'}closeModal();save();go('roadmap');return}
 else if(a==='rg')S.rg=+v;
 else if(a==='chk'){S.checks[el.dataset.id]=el.checked;save();return}
 else if(a==='school'){spModal(+v);return}
 else if(a==='nextq'){qi++}
 else if(a==='timer'){clearInterval(timer);let t=60;const tm=$('#tm');tm.textContent='01:00';timer=setInterval(()=>{t--;tm.textContent='00:'+String(Math.max(t,0)).padStart(2,'0');if(t<=0){clearInterval(timer);toast('시간 종료! 어땠나요?')}},1000);return}
 else if(a==='copy'){copyResult();return}
 save();render(false);
});
document.addEventListener('change',e=>{
 const el=e.target.closest('[data-a]');if(!el||el.tagName!=='SELECT')return;const a=el.dataset.a;
 if(['region','fr','fk','fe','fx','sr','ur','ug','umin','us','uk'].includes(a))S[a]=el.value;else return;
 save();render(false);
});
document.addEventListener('input',e=>{
 if(e.target.id==='fq'){S.fq=e.target.value;save();const r=$('#fres');if(r)r.innerHTML=findResults()}
 else if(e.target.id==='memo'){S.note=e.target.value;save()}
 else if(e.target.id==='sid'){e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)}
 else if(e.target.id==='uq'){S.uq=e.target.value;save();const r=$('#ures');if(r)r.innerHTML=S.ut==='univ'?uResults():S.ut==='rate'?uRates():uDict()}
 else if(e.target.id==='aq'){AQ=e.target.value;const l=$('#alist');if(l)l.innerHTML=adminList()}
 else if(e.target.dataset&&e.target.dataset.d){S.draft[e.target.dataset.d]=e.target.value;save()}
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='lf')doLogin();else if(e.target.id==='af')doAdmin()});
function copyResult(){
 const tt=topTraits(),p=pcts(),r=rank().slice(0,3);
 const txt=`[고교 나침반 결과]\n성향: ${RI[tt[0]].n}(${p[tt[0]]}) · ${RI[tt[1]].n}(${p[tt[1]]})\n추천 유형: ${r.map((x,i)=>`${i+1}. ${TYPES[x.id].name} ${x.sc}점`).join(' / ')}`;
 const fb=()=>modal(`<h3>아래 내용을 복사해 주세요</h3><textarea class="sel" id="cp" readonly>${esc(txt)}</textarea>`);
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('결과를 복사했어요'),fb);else fb();
 setTimeout(()=>{const c=$('#cp');if(c){c.focus();c.select()}},50);
}
render(true);
</script>

</body>
</html>
