@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

.warn{color:var(--warn);font-size:13px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}

.picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}

.modal{background:var(--sf);border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:60;font-size:14px}
.sch2{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--sf);cursor:pointer;min-width:0;width:100%}

.sch2 b{font-size:15px}

.dp.more{color:var(--mut)}
.mut{color:var(--mut);font-size:12px}
.rg{display:flex;flex-direction:column;gap:10px}

.cell{border:0;border-radius:6px;min-width:34px;padding:4px 6px;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}

.z{color:var(--line)}

.modal{max-width:760px}
.whobox{display:flex;align-items:center;gap:8px;flex:none}
.who{font-weight:700;font-size:13px;white-space:nowrap}
.ent{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--sf);min-width:0}

.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.elist{display:flex;flex-direction:column;gap:10px}
.astu{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--sf)}

.login{display:flex;flex-direction:column;gap:12px}
.printonly{display:none}
@media (max-width:560px){.who{display:none}}
@media print{.hd,footer,.noprint,.ov,.toast{display:none!important}.printonly{display:block!important}body{background:#fff;color:#000}.panel{box-shadow:none;border:0;padding:0}.ent{break-inside:avoid}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const store={get(){return ls.get(KEY)},set(v){ls.set(KEY,v)}};
const DEF={grade:null,step:0,ans:{},chips:[],pref:{},done:false,redo:false,type:null,field:null,mq:{},region:'서울',ftype:'all',ffield:'all',q:'',rg:null,checks:{},note:'',fm:'vo',ff:'all',fs:'all',fr:'all',fk:'all',fe:'all',fx:'all',fq:'',sp:'science',sr:'all',user:null,draft:{},edit:null,pfc:[],last:'',delc:null};

let S=Object.assign({},DEF);
(function(){const u=ls.get(SESS);if(u&&u.sid){KEY=ukey(u);S=Object.assign({},DEF,store.get()||{});S.user=u}})();
const save=()=>{if(S.user)store.set(S)};

const NAVT=['흥미·적성 검사','나의 결과','세부 선택·요강','분야별 학교 찾기','중학교 로드맵','내 포트폴리오'];
let timer=null,qi=0;

const nv=q=>'https://search.naver.com/search.naver?query='+encodeURIComponent(q);

/* ---------- 계산 ---------- */
function pcts(){const s={R:0,I:0,A:0,S:0,E:0,C:0};Q.forEach((q,i)=>{s[q[0]]+=S.ans[i]||1});const o={};for(const k in s)o[k]=Math.round((s[k]-3)/9*100);return o}
function rank(){
 const p=pcts(),c=S.chips,out=[];
 const fchips=c.filter(x=>FI[x]);
 for(const id of TORDER){
  const w=TYPES[id].w;let num=0,den=0;for(const k in w){num+=w[k]*p[k];den+=w[k]}
  let sc=num/den;const pos=[],neg=[],a=ADJ[id]||{};
  for(const k in a){const v=S.pref[k];if(v&&a[k][v]!==undefined){const d=a[k][v];sc+=d;const lab=PQ.find(x=>x.k===k).o.find(o=>o[0]===v)[1];if(d>=8)pos.push('“'+lab+'” 응답과 잘 맞아요');else if(d<=-10)neg.push('“'+lab+'” 응답과는 거리가 있어요')}}
  let bonus=0;
  if(id==='science'&&c.includes('sci'))bonus+=8;
  if(id==='private'&&c.includes('sci'))bonus+=2;
  if(id==='foreign'&&c.includes('lang'))bonus+=10;
  if(id==='arts'&&c.includes('art'))bonus+=12;
  if(id==='vocational')bonus+=Math.min(8,fchips.length*4);
  if(id==='meister')fchips.forEach(x=>bonus+=FI[x].meister?4:1);
  sc+=bonus;
  const tr=Object.keys(w).filter(k=>w[k]>=2&&p[k]>=60).sort((x,y)=>p[y]-p[x]).slice(0,2).map(k=>RI[k].n+' 성향이 높아요');
  if(bonus>0)tr.push('관심 분야로 고른 항목과 연결돼요');
  out.push({id,sc:Math.max(5,Math.min(98,Math.round(sc))),why:tr.concat(pos).slice(0,4),warn:neg.slice(0,2)});
 }
 return out.sort((x,y)=>y.sc-x.sc);
}
function fieldRank(only){
 const p=pcts();
 return FIELDS.filter(f=>!only||f.meister).map(f=>{let n=0,d=0;for(const k in f.tr){n+=f.tr[k]*p[k];d+=f.tr[k]}let sc=n/d+(S.chips.includes(f.id)?25:0);return{f,sc:Math.max(5,Math.min(98,Math.round(sc)))}}).sort((a,b)=>b.sc-a.sc);
}
const curType=()=>S.type||(S.done?rank()[0].id:'general');
function topTraits(){const p=pcts();return Object.keys(p).sort((a,b)=>p[b]-p[a])}

/* ---------- 공통 렌더 ---------- */

const ol=a=>`<ol class="list">${a.map(x=>`<li>${x}</li>`).join('')}</ol>`;
const meter=v=>`<div class="meter" role="img" aria-label="적합도 ${v}%"><i style="width:${v}%"></i></div>`;
const NOTICE='<div class="notice">[ 이 자료는 진로·진학 상담 참고용이에요. 전형은 해마다 바뀌니 학교와 교육청 공고를 꼭 확인하세요. ]</div>';
function typePicker(cur,act){return `<div class="picker" role="group" aria-label="고등학교 유형">${TORDER.map(t=>`<button class="chip" data-a="${act}" data-v="${t}" aria-pressed="${t===cur}">${TYPES[t].name}</button>`).join('')}</div>`}

/* ---------- 뷰: 검사 ---------- */

  return `${NOTICE}<section class="panel"><h1>검사를 마쳤어요</h1><p class="lead">가장 잘 맞는 유형은 <b>${TYPES[r.id].name}</b>이에요. 결과를 보고 세부 선택으로 이어 가거나, 다시 검사해 볼 수 있어요.</p>
  <div class="row"><button class="btn" data-a="go" data-v="result">결과 보기</button><button class="btn ghost" data-a="redo">처음부터 다시 검사하기</button></div></section>`;
 }

  body=`<h1>나에게 맞는 고등학교,<br>중1부터 찾아볼까요?</h1>
  <p class="lead">간단한 흥미·적성 검사로 나의 성향을 확인하고, 일반고·자사고·특목고·마이스터고·특성화고·예고 중 어디가 맞는지 살펴본 뒤 지역별 학교와 입학요강, 중학교 생활 로드맵까지 이어서 확인해요. 약 5분 걸려요.</p>
  <ol class="steps"><li>1 흥미·적성</li><li>2 고교 유형</li><li>3 세부 계열</li><li>4 학교·요강</li><li>5 중학교 로드맵</li></ol>
  <div class="field"><label>지금 학년은?</label><div class="tabs" role="group" aria-label="학년">${[1,2,3].map(g=>`<button data-a="grade" data-v="${g}" aria-pressed="${S.grade===g}">중${g}</button>`).join('')}</div></div>`;
 }else if(st>=1&&st<=3){
  const from=(st-1)*6;
  body=`<h2>나는 이런 사람이에요 <span class="tag">${st}/3</span></h2><p class="lead">얼마나 그런지 솔직하게 골라 주세요. 정답은 없어요.</p>`+
  Q.slice(from,from+6).map((q,j)=>{const i=from+j;return `<div class="q"><p><b>${i+1}.</b> ${q[1]}</p><div class="likert" role="group" aria-label="문항 ${i+1}">${LK.map((l,v)=>`<button data-a="ans" data-i="${i}" data-v="${v+1}" aria-pressed="${S.ans[i]===v+1}">${l}</button>`).join('')}</div></div>`}).join('');
 }else if(st===4){
  body=`<h2>관심 있는 분야를 골라 보세요</h2><p class="lead">최대 3개까지 고를 수 있어요. 고르지 않아도 괜찮아요.</p><div class="row">${INT.map(c=>`<button class="chip" data-a="chip" data-v="${c.id}" aria-pressed="${S.chips.includes(c.id)}">${c.n}</button>`).join('')}</div>`;
 }else{
  body=`<h2>나의 상황과 바람</h2><p class="lead">학교 유형을 고를 때 중요한 조건이에요.</p>`+PQ.map(q=>`<div class="q"><p><b>${q.q}</b></p><div class="opts">${q.o.map(o=>`<button class="opt" data-a="pref" data-k="${q.k}" data-v="${o[0]}" aria-pressed="${S.pref[q.k]===o[0]}">${o[1]}</button>`).join('')}</div></div>`).join('');
 }
 let ok=true;
 if(st===0)ok=!!S.grade;else if(st>=1&&st<=3)ok=Q.slice((st-1)*6,st*6).every((q,j)=>S.ans[(st-1)*6+j]);else if(st===5)ok=PQ.every(q=>S.pref[q.k]);
 return `${NOTICE}<section class="panel"><div class="prog" role="progressbar" aria-valuenow="${pg}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pg}%"></i></div>${body}
 <div class="row" style="justify-content:space-between">${st>0?'<button class="btn ghost" data-a="prev">이전</button>':'<span></span>'}
 <button class="btn" data-a="next" ${ok?'':'disabled'}>${st===5?'결과 보기':'다음'}</button></div>${ok?'':'<p class="warn">모든 문항에 답하면 다음으로 넘어갈 수 있어요.</p>'}</section>`;
}

function needTest(){return `${NOTICE}<section class="panel"><h2>아직 검사 결과가 없어요</h2><p class="lead">먼저 흥미·적성 검사를 해 보세요. 검사 없이 고교 유형을 직접 살펴보려면 “세부 선택·요강” 탭으로 가도 돼요.</p><div class="row"><button class="btn" data-a="go" data-v="start">검사 시작하기</button><button class="btn ghost" data-a="go" data-v="detail">유형 바로 보기</button></div></section>`}

 if(!S.done)return needTest();

  <section class="panel soft"><h3>직업계고를 고민한다면, 이런 분야가 어울려요</h3><div class="grid">${fr.map(x=>`<div class="rec"><h3>${x.f.n}</h3><p class="lead" style="font-size:13px">${x.f.d}</p>${meter(x.sc)}<button class="btn ghost sm" data-a="pickf" data-v="${x.f.id}">분야 자세히 보기</button></div>`).join('')}</div></section>

}

const P=o=>Object.assign({ff:S.ff,fs:S.fs,fr:S.fr,q:S.fq.trim()},o);
function match(s,p){
 if(S.fk!=='all'&&s.k!==S.fk)return null;
 if(S.fe!=='all'&&s.e!==S.fe)return null;
 if(S.fx!=='all'&&s.x!==S.fx)return null;
 if(p.fr&&p.fr!=='all'&&s.r!==p.fr)return null;
 let ds=s.d;
 if(p.ff!=='all'){ds=ds.filter(d=>d.f===p.ff);if(p.fs!=='all')ds=ds.filter(d=>d.s===+p.fs)}
 if(p.q&&!(s.n.includes(p.q)||s.m.includes(p.q)))ds=ds.filter(d=>d.n.includes(p.q));
 return ds.length?ds:null;
}
const kShort=k=>k==='일반고(종합고)'?'종합고':k;
function sCard(s,ds){

 <span class="dps">${ds.slice(0,5).map(d=>`<span class="dp">${esc(d.n)}</span>`).join('')}${ds.length>5?`<span class="dp more">외 ${ds.length-5}개</span>`:''}</span>

}

 // 지역 × 분야 표

 // 지역별 목록

 const editing=!!S.edit;
 return `<section class="panel noprint"><div class="row" style="justify-content:space-between"><h2>${esc(S.user.name)}의 진로 포트폴리오</h2><span id="pfstat">${statHTML()}</span></div>
 <p class="lead">${editing?'기록을 고치는 중이에요.':'활동할 때마다 날짜, 알게 된 점, 다짐, 궁금한 점을 남겨 보세요. 기록은 계속 쌓여요.'}</p>
 <div class="grid">
  <div class="field"><label for="pf-date">① 날짜</label><input class="sel" type="date" id="pf-date" data-d="date" value="${esc(d.date)}"></div>
  <div class="field"><label for="pf-act">어떤 활동을 했나요?</label><select class="sel" id="pf-act" data-d="act">${ACTS.map(a=>`<option ${d.act===a?'selected':''}>${a}</option>`).join('')}</select></div>
 </div>
 <div class="field"><label for="pf-target">살펴본 학교·분야 <span class="mut">(선택)</span></label><input class="sel" id="pf-target" data-d="target" maxlength="60" placeholder="예: 선린인터넷고 / IT·소프트웨어" value="${esc(d.target)}"></div>
 <div class="field"><label for="pf-did">② 오늘 알게 된 점 · 한 일</label><textarea class="sel" id="pf-did" data-d="did" maxlength="1000" placeholder="무엇을 살펴보고 무엇을 알게 되었나요?">${esc(d.did||'')}</textarea></div>
 <div class="field"><label for="pf-res">③ 나의 다짐</label><textarea class="sel" id="pf-res" data-d="res" maxlength="1000" placeholder="앞으로 중학교 생활에서 해 보겠다고 다짐한 것">${esc(d.res||'')}</textarea></div>
 <div class="field"><label for="pf-q">④ 의문사항 <span class="mut">(궁금한 점이 없으면 비워 두세요)</span></label><textarea class="sel" id="pf-q" data-d="q" maxlength="1000" placeholder="더 알아보고 싶은 것, 선생님께 물어보고 싶은 것">${esc(d.q||'')}</textarea></div>
 <div class="row"><button class="btn" data-a="pf-save">${editing?'고친 내용 저장':'기록 남기기'}</button>${editing?'<button class="btn ghost" data-a="pf-cancel">고치기 취소</button>':''}</div></section>
 <section class="panel"><div class="row" style="justify-content:space-between"><h2>내 기록 모음</h2><span class="row noprint" style="gap:6px"><button class="btn ghost sm" data-a="pf-print">인쇄·PDF 저장</button><button class="btn ghost sm" data-a="pf-copy">글로 복사</button></span></div>
 <p class="mut printonly">${esc(S.user.sid)} ${esc(S.user.name)} · 고교 나침반 진로 포트폴리오</p>
 <div id="pflist" style="display:flex;flex-direction:column;gap:14px">${pfListHTML()}</div></section>`;
}
async function pfSave(){
 const d=S.draft,u=S.user,did=(d.did||'').trim(),res=(d.res||'').trim();
 if(!d.date){toast('날짜를 골라 주세요');return}
 if(!did||!res){toast('알게 된 점과 다짐을 써 주세요');return}
 PFGEN++;
 const old=S.edit?S.pfc.find(e=>e.id===S.edit):null;
 const e={id:old?old.id:uid(),sid:u.sid,name:u.name,date:d.date,act:d.act||ACTS[0],target:(d.target||'').trim(),did,res,q:(d.q||'').trim(),snap:old?old.snap:snapText(),created:old?old.created:Date.now(),updated:Date.now()};
 S.pfc=S.pfc.filter(x=>x.id!==e.id);S.pfc.push(Object.assign({_p:1},e));
 S.draft={date:todayStr(),act:e.act,target:S.last||''};S.edit=null;save();PFBUSY=1;render(false);window.scrollTo(0,0);
 try{const r=await API.call({action:'save',entry:e});if(r.ok){const x=S.pfc.find(z=>z.id===e.id);if(x)x._p=0;PFSTAT=CONFIG.api?'ok':'';PFBUSY=0;save();drawPF();toast('기록을 남겼어요');return}}catch(err){}
 PFBUSY=0;PFSTAT='err';drawPF();toast('서버에 보내지 못했어요. 이 기기에 저장했고 다음에 접속할 때 다시 보내요');
}
async function pfDel(id){
 PFGEN++;
 const u=S.user,x=S.pfc.find(e=>e.id===id);S.pfc=S.pfc.filter(e=>e.id!==id);S.delc=null;save();drawPF();
 if(x&&!x._p||x&&x._p){try{await API.call({action:'del',id,sid:u.sid,name:u.name})}catch(e){toast('서버에서 지우지 못했어요. 나중에 다시 시도해 주세요')}}
}
function pfText(){
 return '[고교 나침반 진로 포트폴리오] '+S.user.sid+' '+S.user.name+'\n\n'+pfSorted(S.pfc).map(e=>'■ '+e.date+' · '+e.act+(e.target?' · '+e.target:'')+'\n알게 된 점: '+e.did+'\n다짐: '+e.res+'\n의문사항: '+(e.q||'없음')).join('\n\n');
}
function copyText(t,msg){
 const fb=()=>modal('<h3>아래 내용을 복사해 주세요</h3><textarea class="sel" id="cp" readonly style="min-height:200px">'+esc(t)+'</textarea>');
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast(msg),fb);else fb();
 setTimeout(()=>{const c=$('#cp');if(c){c.focus();c.select()}},50);
}

/* 관리자 */
let ADM=null,ADMPW='',AQ='';
function vAdmin(){
 if(!ADM)return `<section class="panel" style="max-width:420px;margin:20px auto;width:100%"><h2>관리자 화면</h2><p class="lead">담당 선생님만 학생들의 기록을 볼 수 있어요.</p>
 <form id="af" autocomplete="off" novalidate><div class="field"><label for="apw">비밀번호</label><input class="sel" id="apw" type="password" inputmode="numeric" autocomplete="off"></div>
 <p class="warn" id="aerr" role="alert" hidden></p><div class="row" style="margin-top:10px"><button class="btn" type="submit">들어가기</button><a class="btn ghost" href="#start">학생 화면으로</a></div></form></section>`;
 return `<section class="panel"><div class="row" style="justify-content:space-between"><h2>학생 진로 포트폴리오 (관리자)</h2><span class="row" style="gap:6px"><button class="btn ghost sm" data-a="adm-refresh">새로고침</button><button class="btn ghost sm" data-a="adm-csv">CSV로 저장</button><button class="btn ghost sm" data-a="adm-out">나가기</button></span></div>
 ${CONFIG.api?'':'<div class="callout">구글 시트와 연결되지 않은 체험 모드예요. 이 기기에서 입력한 기록만 보여요.</div>'}
 <div class="field"><label for="aq">학번·이름·내용으로 찾기</label><input class="sel" id="aq" placeholder="예: 3105, 홍길동, 소프트웨어" value="${esc(AQ)}"></div>
 <div id="alist" style="display:flex;flex-direction:column;gap:10px">${adminList()}</div></section>`;
}
function adminList(){
 const q=AQ.trim(),by={};
 ADM.forEach(e=>{const k=e.sid+' '+e.name;(by[k]=by[k]||[]).push(e)});
 let keys=Object.keys(by).sort();
 if(q)keys=keys.filter(k=>k.includes(q)||by[k].some(e=>[e.target,e.did,e.res,e.q,e.act].join(' ').includes(q)));
 const all=ADM.length;
 if(!keys.length)return '<div class="callout">조건에 맞는 기록이 없어요.</div>';
 return `<div class="row"><span class="tag acc">학생 ${Object.keys(by).length}명</span><span class="tag">전체 기록 ${all}개</span><span class="tag">검색 결과 ${keys.length}명</span></div>`+keys.map(k=>{const L=pfSorted(by[k]),nq=L.filter(e=>e.q&&e.q.trim()).length;
  return `<details class="astu"><summary><b>${esc(k)}</b> <span class="tag">${L.length}개</span> <span class="tag">최근 ${esc(L[0].date)}</span>${nq?`<span class="tag amb">의문사항 ${nq}</span>`:''}</summary><div class="elist" style="margin-top:10px">${L.map(e=>entryCard(e,'adm')).join('')}</div></details>`}).join('');
}
async function doAdmin(){
 const pw=($('#apw').value||'').trim(),er=$('#aerr');
 try{const r=await API.call({action:'adminList',pw});
  if(r.ok){ADM=r.entries||[];ADMPW=pw;render(true);return}
  er.textContent=r.error==='locked'?'시도가 너무 많아요. 10분 뒤 다시 해 주세요.':'비밀번호가 맞지 않아요.';er.hidden=false;
 }catch(e){er.textContent='서버에 연결하지 못했어요.';er.hidden=false}
}
async function admRefresh(){try{const r=await API.call({action:'adminList',pw:ADMPW});if(r.ok){ADM=r.entries||[];render(false);toast('새로 불러왔어요')}}catch(e){toast('서버에 연결하지 못했어요')}}
function admCsv(){
 const H=['학번','이름','날짜','활동','살펴본 학교·분야','알게 된 점','다짐','의문사항','당시 결과'];
 const c=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const rows=ADM.slice().sort((a,b)=>(a.sid+a.name).localeCompare(b.sid+b.name)||(a.date||'').localeCompare(b.date||'')).map(e=>[e.sid,e.name,e.date,e.act,e.target,e.did,e.res,e.q,e.snap].map(c).join(','));
 const blob=new Blob(['﻿'+[H.map(c).join(',')].concat(rows).join('\r\n')],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='진로포트폴리오_'+todayStr()+'.csv';document.body.appendChild(a);a.click();a.remove();
}

/* ---------- 라우팅·렌더 ---------- */
function route(){const h=location.hash.replace('#','');return h==='admin'?'admin':ROUTES.includes(h)?h:'start'}
function go(v){if(location.hash==='#'+v)render(true);else location.hash=v}
const cta=r=>`<section class="panel soft noprint"><div class="row" style="justify-content:space-between"><div><b>오늘 활동을 기록해 볼까요?</b><p class="mut">날짜, 알게 된 점, 다짐, 의문사항을 포트폴리오에 남겨요.</p></div><button class="btn" data-a="pfnew" data-v="${r}">포트폴리오에 기록하기</button></div></section>`;
function render(top){
 clearInterval(timer);
 const r=route(),y=window.scrollY;
 hdUser();
 if(r==='admin'){$('#nav').innerHTML='';$('#app').innerHTML=vAdmin();document.title='관리자 · 고교 나침반';window.scrollTo(0,top?0:y);return}
 if(!S.user){$('#nav').innerHTML='';$('#app').innerHTML=vLogin();document.title='고교 나침반';window.scrollTo(0,0);return}
 $('#nav').innerHTML=ROUTES.map((k,i)=>`<button data-a="go" data-v="${k}" ${k===r?'aria-current="page"':''}><b>${i+1}</b>${NAVT[i]}</button>`).join('');
 let html={start:vStart,result:vResult,detail:vDetail,schools:vSchools,roadmap:vRoadmap,portfolio:vPortfolio}[r]();
 if(ROUTE_ACT[r])html+=cta(r);
 $('#app').innerHTML=html;
 document.title=(r==='start'?'':NAVT[ROUTES.indexOf(r)]+' · ')+'고교 나침반';
 window.scrollTo(0,top?0:y);
 const a=document.querySelector('.nav [aria-current]');if(a&&a.scrollIntoView)a.scrollIntoView({inline:'center',block:'nearest'});
 if(r==='portfolio')pfLoad();
}
window.addEventListener('hashchange',()=>render(true));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT'&&el.type!=='checkbox')return;
 const a=el.dataset.a,v=el.dataset.v;
 if(a==='go'){closeModal();go(v);return}
 if(a==='logout'){doLogout();return}
 if(a==='pfnew'){if(!S.edit){const d=S.draft;if(!(d.did||d.res||d.q))S.draft={date:todayStr(),act:ROUTE_ACT[v]||ACTS[0],target:S.last||''};else d.act=ROUTE_ACT[v]||d.act}save();go('portfolio');return}
 if(a==='pf-save'){pfSave();return}
 if(a==='pf-edit'){const e=S.pfc.find(x=>x.id===v);if(e){S.edit=e.id;S.draft={date:e.date,act:e.act,target:e.target,did:e.did,res:e.res,q:e.q};save();render(true)}return}
 if(a==='pf-cancel'){S.edit=null;S.draft={};save();render(true);return}
 if(a==='pf-del'){S.delc=v;drawPF();return}
 if(a==='pf-delx'){S.delc=null;drawPF();return}
 if(a==='pf-del2'){pfDel(v);return}
 if(a==='pf-print'){window.print();return}
 if(a==='pf-copy'){copyText(pfText(),'기록을 복사했어요');return}
 if(a==='adm-out'){ADM=null;ADMPW='';render(true);return}
 if(a==='adm-refresh'){admRefresh();return}
 if(a==='adm-csv'){admCsv();return}
 if(a==='close'){closeModal();return}
 if(a==='grade'){S.grade=+v;S.rg=+v}
 else if(a==='ans')S.ans[+el.dataset.i]=+v;
 else if(a==='pref')S.pref[el.dataset.k]=v;
 else if(a==='chip'){const i=S.chips.indexOf(v);if(i>=0)S.chips.splice(i,1);else if(S.chips.length<3)S.chips.push(v);else toast('관심 분야는 최대 3개까지 고를 수 있어요')}
 else if(a==='next'){if(S.step===5){S.done=true;S.redo=false;S.type=null;S.step=0;save();go('result');return}S.step++;save();render(true);return}
 else if(a==='prev'){S.step--;save();render(true);return}
 else if(a==='redo'){S.redo=true;S.step=0;S.ans={};S.chips=[];S.pref={};S.done=false;S.type=null;save();go('start');return}
 else if(a==='pick'){S.type=v;save();go('detail');return}
 else if(a==='pickf'){const f=FI[v];S.field=v;S.type=f.meister&&rank().find(x=>x.id==='meister').sc>=rank().find(x=>x.id==='vocational').sc?'meister':'vocational';save();go('detail');return}
 else if(a==='type'||a==='rtype'){S.type=v;if(a==='type')qi=0}
 else if(a==='field')S.field=S.field===v?null:v;
 else if(a==='mq')S.mq[+el.dataset.i]=v;
 else if(a==='findf'){S.ff=v;S.fs='all';S.fm='vo';S.fr='all';save();go('schools');return}
 else if(a==='findt'){if(v==='meister'||v==='vocational'){S.fm='vo';S.fk=v==='meister'?'마이스터고':'특성화고'}else{S.fm='sp';S.sp=v}save();go('schools');return}
 else if(a==='fmode')S.fm=v;
 else if(a==='ffield'){S.ff=S.ff===v?'all':v;S.fs='all'}
 else if(a==='fsub')S.fs=S.fs===v?'all':v;
 else if(a==='fr')S.fr=S.fr===v?'all':v;
 else if(a==='cell'){S.ff=el.dataset.f;S.fs='all';S.fr=el.dataset.r}
 else if(a==='fclear'){S.ff='all';S.fs='all';S.fr='all';S.fk='all';S.fe='all';S.fx='all';S.fq=''}
 else if(a==='sptype')S.sp=v;
 else if(a==='vschool'){vModal(+v);return}
 else if(a==='froad'){const f=FI[v];if(f){S.field=v;S.type=f.meister?'meister':'vocational'}closeModal();save();go('roadmap');return}
 else if(a==='rg')S.rg=+v;
 else if(a==='chk'){S.checks[el.dataset.id]=el.checked;save();return}
 else if(a==='school'){spModal(+v);return}
 else if(a==='nextq'){qi++}
 else if(a==='timer'){clearInterval(timer);let t=60;const tm=$('#tm');tm.textContent='01:00';timer=setInterval(()=>{t--;tm.textContent='00:'+String(Math.max(t,0)).padStart(2,'0');if(t<=0){clearInterval(timer);toast('시간 종료! 어땠나요?')}},1000);return}
 else if(a==='copy'){copyResult();return}
 save();render(false);
});
document.addEventListener('change',e=>{
 const el=e.target.closest('[data-a]');if(!el||el.tagName!=='SELECT')return;const a=el.dataset.a;
 if(['region','fr','fk','fe','fx','sr'].includes(a))S[a]=el.value;else return;
 save();render(false);
});
document.addEventListener('input',e=>{
 if(e.target.id==='fq'){S.fq=e.target.value;save();const r=$('#fres');if(r)r.innerHTML=findResults()}
 else if(e.target.id==='memo'){S.note=e.target.value;save()}
 else if(e.target.id==='sid'){e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)}
 else if(e.target.id==='aq'){AQ=e.target.value;const l=$('#alist');if(l)l.innerHTML=adminList()}
 else if(e.target.dataset&&e.target.dataset.d){S.draft[e.target.dataset.d]=e.target.value;save()}
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='lf')doLogin();else if(e.target.id==='af')doAdmin()});
function copyResult(){
 const tt=topTraits(),p=pcts(),r=rank().slice(0,3);
 const txt=`[고교 나침반 결과]\n성향: ${RI[tt[0]].n}(${p[tt[0]]}) · ${RI[tt[1]].n}(${p[tt[1]]})\n추천 유형: ${r.map((x,i)=>`${i+1}. ${TYPES[x.id].name} ${x.sc}점`).join(' / ')}`;
 const fb=()=>modal(`<h3>아래 내용을 복사해 주세요</h3><textarea class="sel" id="cp" readonly>${esc(txt)}</textarea>`);
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('결과를 복사했어요'),fb);else fb();
 setTimeout(()=>{const c=$('#cp');if(c){c.focus();c.select()}},50);
}
render(true);
</script>
